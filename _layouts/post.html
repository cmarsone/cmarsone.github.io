---
layout: default
---
<article class="article-shell post-article h-entry" itemscope itemtype="https://schema.org/BlogPosting">
  <header class="page-intro post-intro">
    <a class="back-link" href="{{ '/notes/' | relative_url }}">← Toutes les notes</a>
    <p class="eyebrow">Carnet de Clément · <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: '%d %B %Y' }}</time></p>
    <h1 class="p-name" itemprop="headline">{{ page.title | escape }}</h1>
    {% if page.author %}<p class="byline">Par {{ page.author | join: ', ' }}</p>{% endif %}
  </header>
  <div class="prose e-content" itemprop="articleBody">{{ content }}</div>
  <div class="article-end"><span>—</span><a href="{{ '/notes/' | relative_url }}">Continuer la lecture</a></div>
  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
